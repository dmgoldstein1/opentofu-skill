name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/workflows/**'
      - '.github/release/**'
  push:
    branches: [master, main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/workflows/**'
      - '.github/release/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Skill Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Check SKILL.md Frontmatter
        run: |
          python3 << 'EOF'
          from pathlib import Path
          import re
          import sys
          import yaml

          print("Validating SKILL.md frontmatter for all skills...")

          skill_files = sorted(Path('skills').glob('*/SKILL.md'))
          if not skill_files:
            print("ERROR: No skills/*/SKILL.md files found")
            sys.exit(1)

          required = {'name', 'description'}

          for skill_file in skill_files:
            content = skill_file.read_text()

            if not content.startswith('---'):
              print(f"ERROR: {skill_file} has no frontmatter")
              sys.exit(1)

            parts = content.split('---', 2)
            if len(parts) < 3:
              print(f"ERROR: {skill_file} has invalid frontmatter format")
              sys.exit(1)

            frontmatter = yaml.safe_load(parts[1]) or {}
            missing = required - set(frontmatter.keys())

            if missing:
              print(f"ERROR: {skill_file} missing required fields: {missing}")
              sys.exit(1)

            name = frontmatter['name']
            if not re.match(r'^[a-zA-Z0-9-]+$', name):
              print(f"ERROR: {skill_file} has invalid name: {name}")
              sys.exit(1)

            desc_len = len(frontmatter['description'])
            if desc_len > 1024:
              print(f"ERROR: {skill_file} description too long: {desc_len} chars")
              sys.exit(1)

            optional_fields = set(frontmatter.keys()) - required
            print(f"OK: {skill_file} frontmatter valid ({desc_len} chars)")
            if optional_fields:
              print(f"  Optional fields: {optional_fields}")

              if 'license' in frontmatter:
                print(f"    - license: {frontmatter['license']}")

              if 'metadata' in frontmatter and isinstance(frontmatter['metadata'], dict):
                metadata = frontmatter['metadata']
                if 'version' in metadata:
                  print(f"    - metadata.version: {metadata['version']}")
                if 'author' in metadata:
                  print(f"    - metadata.author: {metadata['author']}")
          EOF

      - name: Check Codex Manifest Version Sync
        run: |
          python3 << 'EOF'
          import json
          import os
          import re
          import sys
          import yaml

          SEMVER = re.compile(r'^\d+\.\d+\.\d+$')

          manifest_path = '.codex-plugin/plugin.json'
          if not os.path.exists(manifest_path):
              print("ℹ️  No .codex-plugin/plugin.json; skipping sync check")
              sys.exit(0)

          with open('skills/opentofu-skill/SKILL.md') as f:
              fm = yaml.safe_load(f.read().split('---', 2)[1])
          skill_version = (fm.get('metadata') or {}).get('version')

          with open(manifest_path) as f:
              manifest_version = json.load(f).get('version')

          # Both must exist and be real semver, not merely equal: equality
          # alone passes when both are missing/empty.
          for label, value in (
              ('SKILL.md metadata.version', skill_version),
              (f'{manifest_path} version', manifest_version),
          ):
              if not (isinstance(value, str) and SEMVER.match(value)):
                  print(
                      f"❌ ERROR: {label} is not a valid semver: {value!r}. "
                      f"CI owns these; do not hand-edit (see CLAUDE.md).")
                  sys.exit(1)

          if skill_version != manifest_version:
              print(
                  f"❌ ERROR: version mismatch - SKILL.md metadata.version="
                  f"{skill_version!r} vs {manifest_path}={manifest_version!r}. "
                  f"CI owns these; do not hand-edit (see CLAUDE.md).")
              sys.exit(1)

          print(f"✅ Codex manifest version in sync ({manifest_version})")
          EOF

      - name: Check File Size
        run: |
          echo "Checking skill file sizes..."
          for skill_file in skills/*/SKILL.md; do
            [ -f "$skill_file" ] || continue
            LINES=$(wc -l < "$skill_file")
            WORDS=$(wc -w < "$skill_file")
            echo "$skill_file: $LINES lines, $WORDS words"
            if [ "$LINES" -gt 500 ]; then
              echo "WARNING: $skill_file has $LINES lines (guideline: <500)"
            else
              echo "OK: $skill_file size check passed"
            fi
          done

      - name: Check for Broken Links
        run: |
          echo "Checking internal reference links..."
          broken=0
          for skill_dir in skills/*; do
            [ -d "$skill_dir" ] || continue
            [ -f "$skill_dir/SKILL.md" ] || continue

            echo "Checking $skill_dir"
            while read -r link; do
              [ -n "$link" ] || continue
              if [ ! -f "$skill_dir/$link" ]; then
                echo "ERROR: Broken link in $skill_dir: $link"
                broken=1
              fi
            done < <(grep -oP '\[.*?\]\(references/.*?\.md.*?\)' "$skill_dir/SKILL.md" "$skill_dir"/references/*.md 2>/dev/null | \
                     sed 's/.*(//' | sed 's/).*//' | sed 's/#.*//')
          done

          if [ "$broken" -ne 0 ]; then
            exit 1
          fi
          echo "OK: No broken links"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            skills/**/*.md
            README.md
            CONTRIBUTING.md
        continue-on-error: true

      - name: Summary
        if: success()
        run: |
          echo "## Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "All skill validation checks passed." >> $GITHUB_STEP_SUMMARY
